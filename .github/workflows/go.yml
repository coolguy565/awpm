name: AWPM Build (Linux Only)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Prepare Go modules
        working-directory: ./src
        run: go mod tidy

      # -------------------------
      # Linux AMD64 build
      # -------------------------
      - name: Build AWPM (linux amd64)
        working-directory: ./src
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p ../dist
          go build -o ../dist/awpm-linux-amd64 .

      # -------------------------
      # Linux ARM64 build
      # -------------------------
      - name: Build AWPM (linux arm64)
        working-directory: ./src
        env:
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o ../dist/awpm-linux-arm64 .

      # -------------------------
      # Package installer assets
      # -------------------------
      - name: Prepare installer assets
        run: |
          mkdir -p dist/assets
          cp install.sh dist/assets/
          cp pkgregistry.json dist/assets/

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awpm-linux-build
          path: dist/*
